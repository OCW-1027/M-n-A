<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan M&amp;A Deal Radar</title>
<style>
:root{
  --navy-900:#060E1C; --navy-800:#0A1628; --navy-700:#0F2036; --navy-600:#152B45;
  --line:#1E3A57; --line-soft:#16293F;
  --ink:#E6EDF5; --ink-2:#9DB2C9; --ink-3:#647D99;
  --cyan:#00D9FF; --cyan-dim:#0B6F85;
  --amber:#E9A23B; --rose:#E4636B; --mint:#3FCF9A; --violet:#9B8CFF;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--navy-900); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--cyan)}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--navy-700);color:var(--ink);padding:7px 13px}
button:hover{border-color:var(--cyan-dim);background:var(--navy-600)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
button.primary{background:var(--cyan);color:#04222B;border-color:var(--cyan);font-weight:600}
button.primary:hover{background:#4EE6FF}
button.ghost{background:transparent}
button.danger{color:var(--rose);border-color:#4A2028}
input,select,textarea{
  font-family:inherit;font-size:13px;background:var(--navy-900);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%
}
textarea{line-height:1.6;resize:vertical}
label.f{display:block;font-size:11px;color:var(--ink-3);margin:0 0 4px}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{width:196px;flex:none;background:var(--navy-800);border-right:1px solid var(--line-soft);padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:12px}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:11px;color:var(--ink-3)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 18px;color:var(--ink-2);text-decoration:none;font-size:13px;border-left:2px solid transparent}
.nav a:hover{color:var(--ink);background:var(--navy-700)}
.nav a.on{color:var(--cyan);border-left-color:var(--cyan);background:var(--navy-700)}
.nav .cnt{font-size:11px;color:var(--ink-3)}
.railfoot{padding:14px 18px;margin-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:7px}
.main{flex:1;min-width:0;padding:26px 30px 70px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px;font-weight:600}
.head p{margin:4px 0 0;color:var(--ink-3);font-size:12.5px;max-width:70ch}

/* panels */
.panel{background:var(--navy-800);border:1px solid var(--line-soft);border-radius:10px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
.sect{margin:22px 0 10px;font-size:12px;color:var(--ink-3);letter-spacing:.04em}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--cyan)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--navy-700)}
td.r,th.r{text-align:right}

/* badges */
.b{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap;line-height:1.5}
.b-cy{color:var(--cyan);border-color:#0E4A5A;background:#062730}
.b-am{color:var(--amber);border-color:#4B3413;background:#2A1D08}
.b-ro{color:var(--rose);border-color:#4A2028;background:#2B1114}
.b-mi{color:var(--mint);border-color:#134634;background:#08281E}
.b-vi{color:var(--violet);border-color:#332C63;background:#1A163A}
.b-gy{color:var(--ink-2);border-color:var(--line);background:var(--navy-700)}

/* score */
.score{font-size:26px;font-weight:600;line-height:1}
.bar{height:5px;background:var(--navy-600);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan)}
.brk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;font-size:12px}
.brk .lab{color:var(--ink-2)}
.brk .val{color:var(--ink);font-size:12px}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--navy-800);border:1px solid var(--line-soft);border-radius:8px;padding:10px;min-height:120px}
.col h3{margin:0 0 9px;font-size:11.5px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between}
.card{background:var(--navy-700);border:1px solid var(--line);border-left:2px solid var(--line);border-radius:5px;padding:9px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--cyan-dim)}
.card .nm{font-size:12.5px;margin-bottom:3px;line-height:1.35}
.card .mt{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.kill{border-left-color:var(--rose)!important}
.warn{border-left-color:var(--amber)!important}
.good{border-left-color:var(--mint)!important}

.kv{display:grid;grid-template-columns:112px 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.chk input[type=checkbox]{width:15px;height:15px;flex:none;margin-top:3px;accent-color:var(--cyan)}
.chk .q{flex:1;font-size:13px}
.note{background:var(--navy-700);border-left:2px solid var(--cyan-dim);padding:10px 13px;border-radius:0 var(--r) var(--r) 0;font-size:12.5px;color:var(--ink-2)}
.empty{color:var(--ink-3);font-size:13px;padding:34px 0;text-align:center}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.log{font-size:12px;color:var(--ink-2);padding:6px 0;border-bottom:1px solid var(--line-soft)}
.log b{color:var(--ink-3);font-weight:400;font-size:11px}
.stat .n{font-size:24px;font-weight:600}
.stat .l{font-size:11.5px;color:var(--ink-3)}
.hbar{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:12px}
.hbar .t{width:130px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .g{flex:1;height:14px;background:var(--navy-700);border-radius:3px;overflow:hidden}
.hbar .g i{display:block;height:100%;background:var(--cyan-dim)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-600);border:1px solid var(--cyan-dim);color:var(--ink);padding:10px 18px;border-radius:22px;font-size:13px;z-index:99}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="brand"><h1>Deal Radar</h1><p>일본 M&amp;A 안건 검토</p></div>
    <div class="nav" id="nav"></div>
    <div class="railfoot">
      <button class="primary" id="syncbtn" onclick="syncNow(false)">새 안건 확인</button>
      <button onclick="exportJSON()">백업 내보내기</button>
      <button onclick="document.getElementById('imp').click()">파일 불러오기 (백업·수집)</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
      <input type="file" id="mrg" accept=".json" style="display:none" onchange="importJSON(this)">
      <button class="ghost danger" onclick="hardReset()" style="font-size:11.5px">데이터 초기화</button>
      <p style="font-size:11px;color:var(--ink-3);margin:2px 0 0">데이터는 이 브라우저에만 저장됩니다. 외부로 나가지 않습니다. 작업 후 백업을 내보내 두십시오.</p>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ─────────── 저장 ─────────── */
var MEM=null;
function normalize(o){
  /* 어떤 형태의 데이터가 들어와도 화면이 죽지 않도록 상태를 정상화한다 */
  var base=seed();
  if(!o||typeof o!=='object')return base;
  var out={};
  out.deals=Array.isArray(o.deals)?o.deals:[];
  out.sectors=(o.sectors&&typeof o.sectors==='object')?o.sectors:base.sectors;
  /* 수집 파일(kind:deal_radar_import)이 통째로 저장된 경우: 시드 상태에 안건만 합쳐 복구 */
  if(o.kind==='deal_radar_import'){
    var have={};base.deals.forEach(function(d){have[d.name]=1;});
    out.deals=base.deals.slice();
    o.deals.forEach(function(x){ if(have[x.name])return; var d={};for(var k in x){if(k.charAt(0)!=='_')d[k]=x[k];} out.deals.push(d); });
    out.sectors=base.sectors;
  }
  var mx=0;
  out.deals.forEach(function(d,i){
    if(d.id==null||typeof d.id!=='number')d.id=1000+i;
    if(d.id>mx)mx=d.id;
    d.status=d.status||'신규'; d.flags=d.flags||[]; d.checks=d.checks||{}; d.logs=d.logs||[];
    d.hold=d.hold||5; d.created=d.created||today();
    if(d.industry&&!out.sectors[d.industry])out.sectors[d.industry]={listed:'',band:'',lic:'',people:'',hidden:'',q:[]};
  });
  out.seq=Math.max(typeof o.seq==='number'?o.seq:0,mx);
  return out;
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem('ma_radar_v1');}catch(e){}
  if(raw){
    try{return normalize(JSON.parse(raw));}
    catch(e){ try{localStorage.setItem('ma_radar_v1_broken_'+Date.now(),raw);}catch(e2){} }
  }
  return MEM||seed();
}
function save(){
  MEM=S;
  try{localStorage.setItem('ma_radar_v1',JSON.stringify(S));}catch(e){}
}

  else if(m=s.match(/([\d.]+)億([\d.]+)万/)) v=parseFloat(m[1])*10000+parseFloat(m[2]);
  else if(m=s.match(/([\d.]+)億/))    v=parseFloat(m[1])*10000;

  else if(m=s.match(/([\d.]+)百万/))  v=parseFloat(m[1])*100;
  else if(m=s.match(/([\d.]+)万/))    v=parseFloat(m[1]);

  if(v==null)return null;

}

    var a=yen(/[億万円]/.test(parts[0])?parts[0]:parts[0]+unit), b=yen(parts[1]);

  for(var i=0;i<PREFS.length;i++){if(T.indexOf(PREFS[i])>=0){o.pref=PREFS[i];break;}}
  if(!o.pref){for(var j=0;j<REGIONS.length;j++){if(T.indexOf(REGIONS[j])>=0){o.pref=REGIONS[j];break;}}}
  o.dealType = T.indexOf('事業譲渡')>=0 ? '事業譲渡' : (T.indexOf('株式譲渡')>=0?'株式譲渡':'');
  if(/後継者/.test(T))o.reason='후계자 부재';
  else if(/選択と集中|事業再編|カーブアウト/.test(T))o.reason='사업 재편';
  else if(/成長と発展/.test(T))o.reason='성장·발전';
  else if(/企業再生|事業再生/.test(T))o.reason='기업 재생';
  else if(/引退|高齢/.test(T))o.reason='오너 은퇴';
  var flags=[];
  if(/1円|一円/.test(z2h(T)))flags.push('1엔 매각');
  if(/債務超過/.test(T))flags.push('채무초과');
  if(o.netAssets!=null&&o.netAssets<0&&flags.indexOf('채무초과')<0)flags.push('채무초과');
  o.flags=flags;
  o.listingId=grabNo(T);
  o.raw=T.trim();
  return o;
}

  sel.forEach(function(o){

var FILT={ind:'',pref:'',src:'',track:'',status:'',flag:'',q:'',onlyRated:false};
function filtered(){
  var q=(FILT.q||'').toLowerCase();
  return S.deals.filter(function(d){
    if(FILT.ind&&d.industry!==FILT.ind)return false;
    if(FILT.pref&&d.pref!==FILT.pref)return false;
    if(FILT.src&&d.source!==FILT.src)return false;
    if(FILT.track&&track(d)!==FILT.track)return false;
    if(FILT.status&&d.status!==FILT.status)return false;
    if(FILT.flag==='kill'&&!hasKill(d))return false;
    if(FILT.flag==='warn'&&!hasWarn(d))return false;
    if(FILT.flag==='clean'&&(hasKill(d)||hasWarn(d)))return false;
    if(FILT.onlyRated&&!askOP(d))return false;
    if(q){
      var hay=((d.name||'')+' '+(d.industry||'')+' '+(d.pref||'')+' '+(d.listingId||'')+' '+(d.raw||'').slice(0,400)).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}
function uniq(fn){
  var m={};S.deals.forEach(function(d){var v=fn(d);if(v)m[v]=(m[v]||0)+1;});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a];}).map(function(k){return [k,m[k]];});
}

function mergeJSON(el){
  var f=el.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var o;
    try{o=JSON.parse(r.result);}catch(e){alert('JSON 파일을 읽을 수 없습니다.');el.value='';return;}
    var list=o.deals; if(!list||!list.length){alert('안건이 들어 있지 않은 파일입니다.');el.value='';return;}
    var have={},haveName={};
    S.deals.forEach(function(d){ if(d.listingId)have[d.listingId]=1; haveName[d.name]=1; });
    var add=0,skip=0,newsec=0;
    list.forEach(function(x){
      if((x.listingId&&have[x.listingId])||haveName[x.name]){skip++;return;}
      var d={}; for(var k in x){ if(k.charAt(0)!=='_')d[k]=x[k]; }
      d.id=++S.seq; d.status='신규'; d.created=today(); d.checks={};
      d.flags=d.flags||[]; d.hold=d.hold||5;
      d.logs=[{t:today(),m:(x.source||'수집')+' 자동 수집으로 등록'}];
      if(d.industry&&!S.sectors[d.industry]){
        S.sectors[d.industry]={listed:'',band:'',lic:'',people:'',hidden:'',q:[]}; newsec++;
      }
      S.deals.push(d); add++;
      if(d.listingId)have[d.listingId]=1; haveName[d.name]=1;
    });
    save(); el.value='';
    alert('신규 '+add+'건을 등록했습니다.\n중복으로 건너뛴 안건 '+skip+'건.'+
      (newsec?'\n새 업종 모듈 '+newsec+'개가 만들어졌습니다 — 업종 라이브러리에서 채워주십시오.':''));
    go('list');
  };
  r.readAsText(f);
}

/* ─── 서버에서 새 안건 자동 수신 (같은 도메인이라 CORS 문제 없음) ─── */
var FEEDS=['data/latest_platforms.json','data/latest_jfc.json'];
function syncNow(silent){
  var btn=document.getElementById('syncbtn');
  if(btn){btn.disabled=true;btn.textContent='확인 중…';}
  var added=0, skipped=0, newsec=0, done=0, stamp='', okFeeds=0, failFeeds=0;
  var have={},haveName={};
  S.deals.forEach(function(d){ if(d.listingId)have[d.source+':'+d.listingId]=1; haveName[d.name]=1; });
  function finish(){
    if(added||newsec)save();
    if(btn){btn.disabled=false;btn.textContent='새 안건 확인';}
    /* 수신에 실제로 성공했을 때만 오늘 확인한 것으로 기록한다.
       파일이 아직 없어서 실패한 날을 '확인 완료'로 남기면 영영 다시 시도하지 않는다. */
    if(okFeeds){ try{localStorage.setItem('ma_radar_lastsync',today());}catch(e){} }
    if(added){ toast('신규 '+added+'건을 받았습니다'); go('list'); }
    else if(!silent){
      toast(okFeeds ? '새 안건이 없습니다 (중복 '+skipped+'건 확인)'
                    : '수집 파일을 찾지 못했습니다 — 워크플로가 돌았는지 확인해 주십시오');
      render();
    } else render();
  }
  FEEDS.forEach(function(f){
    fetch(f+'?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(o){
      if(o&&Array.isArray(o.deals)){
        okFeeds++;
        if(o.collected&&o.collected>stamp)stamp=o.collected;
        o.deals.forEach(function(x){
          var key=(x.source||'')+':'+(x.listingId||'');
          if((x.listingId&&have[key])||haveName[x.name]){skipped++;return;}
          var d={}; for(var k in x){ if(k.charAt(0)!=='_')d[k]=x[k]; }
          d.id=++S.seq; d.status='신규'; d.created=today(); d.checks={};
          d.flags=d.flags||[]; d.hold=d.hold||5;
          d.logs=[{t:today(),m:(d.source||'수집')+' 자동 수신'}];
          if(d.industry&&!S.sectors[d.industry]){S.sectors[d.industry]={listed:'',band:'',lic:'',people:'',hidden:'',q:[]};newsec++;}
          S.deals.push(d); added++;
          if(d.listingId)have[key]=1; haveName[d.name]=1;
        });
      }
    }).catch(function(){failFeeds++;}).then(function(){ if(++done===FEEDS.length)finish(); });
  });
}
function autoSync(){
  var last=null; try{last=localStorage.getItem('ma_radar_lastsync');}catch(e){}
  if(last===today())return;
  if(location.protocol==='file:')return;   /* 로컬 파일로 열었을 땐 건너뜀 */
  syncNow(true);
}
function exportJSON(){
  var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='ma_radar_'+today().replace(/-/g,'')+'.json';a.click();
  toast('백업 파일을 내려받았습니다');
}
function importJSON(el){
  var f=el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var o;
    try{o=JSON.parse(r.result);}catch(e){alert('JSON 파일을 읽을 수 없습니다.');el.value='';return;}
    if(!o||!Array.isArray(o.deals)){alert('안건이 들어 있지 않은 파일입니다.');el.value='';return;}
    var isBackup = !!(o.sectors && typeof o.sectors==='object' && o.kind!=='deal_radar_import');
    if(isBackup){
      var replace=confirm('Deal Radar 백업 파일입니다 (안건 '+o.deals.length+'건).\n\n[확인] = 현재 데이터를 이 백업으로 교체\n[취소] = 현재 데이터에 이 백업의 안건을 추가(병합)');
      if(replace){S=normalize(o);save();go('list');toast('백업으로 교체했습니다');el.value='';return;}
    }
    mergeDeals(o.deals, o.source||'파일');
    el.value='';
  };
  r.readAsText(f);
}
function mergeJSON(el){importJSON(el);}
function mergeDeals(list,srcLabel){
  var have={},haveName={};
  S.deals.forEach(function(d){ if(d.listingId)have[d.listingId]=1; haveName[d.name]=1; });
  var add=0,skip=0,newsec=0;
  list.forEach(function(x){
    if((x.listingId&&have[x.listingId])||haveName[x.name]){skip++;return;}
    var d={}; for(var k in x){ if(k.charAt(0)!=='_')d[k]=x[k]; }
    d.id=++S.seq; d.status=d.status&&STATUS.indexOf(d.status)>=0?d.status:'신규'; d.created=d.created||today(); d.checks=d.checks||{};
    d.flags=d.flags||[]; d.hold=d.hold||5;
    d.logs=(d.logs&&d.logs.length)?d.logs:[{t:today(),m:srcLabel+'에서 불러와 등록'}];
    if(d.industry&&!S.sectors[d.industry]){
      S.sectors[d.industry]={listed:'',band:'',lic:'',people:'',hidden:'',q:[]}; newsec++;
    }
    S.deals.push(d); add++;
    if(d.listingId)have[d.listingId]=1; haveName[d.name]=1;
  });
  save();
  alert('신규 '+add+'건을 등록했습니다.\n중복으로 건너뛴 안건 '+skip+'건.'+
    (newsec?'\n새 업종 모듈 '+newsec+'개가 만들어졌습니다 — 업종 라이브러리에서 채워주십시오.':''));
  go('list');
}

(function(){
  var h=(location.hash||'').replace(/^#/,'').split(':');
  if(h[0]&&({intake:1,pipe:1,list:1,sector:1,stats:1})[h[0]]){
    VIEW=h[0]; if(VIEW==='intake'&&h[1])IMODE=h[1];
  }
})();
render();
pushView(true);
autoSync();
</script>
