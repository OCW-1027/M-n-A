name: M&A 안건 수집

on:
  schedule:
    - cron: '0 23 * * *'      # UTC 23:00 = 일본시간 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 폴더 준비
        run: mkdir -p data

      - name: JFC 공개 데이터 수집
        run: python3 collect_jfc.py --min-rev 5000 --min-profit 300 --out data/latest_jfc.json
        continue-on-error: true

      - name: 중개사 공개 안건 수집
        run: python3 collect_platforms.py --pages 3 --min-rev 10000 --out data/latest_platforms.json
        continue-on-error: true

      - name: 수집 결과 확인
        run: |
          date -u +'{"collected":"%Y-%m-%dT%H:%M:%SZ"}' > data/status.json
          ls -l data/
          for f in data/latest_jfc.json data/latest_platforms.json; do
            if [ -f "$f" ]; then
              python3 -c "import json,sys;d=json.load(open('$f'));print('$f', len(d.get('deals',[])), '건')"
            else
              echo "$f 없음"
            fi
          done

      - name: 저장소에 반영
        run: |
          git config user.name  "deal-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ seen.json seen_platforms.json
          git status --short
          git diff --staged --quiet || git commit -m "안건 수집 $(date +%Y-%m-%d)"
          git push
