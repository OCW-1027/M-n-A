name: M&A 안건 수집

on:
  schedule:
    - cron: '0 23 * * *'      # UTC 23:00 = 일본시간 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JFC 공개 데이터 수집
        run: python3 collect_jfc.py --min-rev 5000 --min-profit 300
        continue-on-error: true

      - name: 중개사 공개 안건 수집
        run: python3 collect_platforms.py --pages 3 --min-profit 1000
        continue-on-error: true

      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: deals-${{ github.run_number }}
          path: |
            jfc_import_*.json
            platforms_import_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: 수집 기록 갱신
        run: |
          git config user.name  "deal-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json seen_platforms.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "수집 기록 갱신 $(date +%Y-%m-%d)"
          git push
